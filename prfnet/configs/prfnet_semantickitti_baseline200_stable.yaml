# PRFNet 统一配置：监督训练 + NOMAE/PCP 预训练
# train.py 使用 data/model/train/loss/eval/log
# tools/pretrain_nomae_pcp.py 使用 data/model + pretrain + pretrain_data/pretrain_model + pretrain_log

data:
  root: /root/autodl-tmp/semantickitti/dataset/
  num_classes: 19
  ignore_index: 255
  rv_H: 64
  rv_W: 1024
  pb_H: 640
  pb_W: 1024
  max_points: 131072
  fov_up: 2.0
  fov_down: -24.8
  R_max: 85.0
  batch_size: 2
  num_workers: 20
  val_batch_size: 4
  val_num_workers: 24
  augment: true
  use_polarmix: false   # 稳定版 v2：从零低标注训练先关闭强混合增强
  rotate: true
  flip: true
  scale_min: 0.95
  scale_max: 1.05
  drop_p: 0.02
  polarmix_p: 0.0
  polarmix_sectors: 8
  use_lasermix: false
  lasermix_p: 0.0
  low_label_finetune:
    enable: true
    num_frames: 200      # 改成 100 即可做 100 帧微调
    seed: 42
    balance_by_seq: true
    dump_indices_path: selected_train_indices.txt
  copy_paste:
    enable: true   # 200帧低标注：开启稀有类增强，避免只学到road/building等大类
    bank_path: "instance_bank_semantickitti.npz"
    classes:
      7: {prob: 0.90, k: 3}
      6: {prob: 0.70, k: 3}
      5: {prob: 0.60, k: 2}
      2: {prob: 0.50, k: 2}
      1: {prob: 0.40, k: 2}
    drop_p_base: 0.05
    min_keep_pts: 15
    max_tries: 50

model:
  pb_in: 9
  enc_channels: [64, 128, 256, 256] # 原[96,192,384,384]
  dec_out_c: 64
  head_dropout: 0.10
  expand_ratios: [2, 2, 4, 4]
  rv_strides: [[1,2],[2,2],[2,2],[2,2]]
  pb_strides: [[2,2],[2,2],[2,2],[2,2]]
  aspp_rates: [1, 3, 6, 9]
  use_ds_aaff: true
  ds_aaff_K: 4
  use_surface_normals: true
  use_angle_encoding: true
  use_vcg: false
  use_proto: false
  proto_dim: 64
  rv_in: 12

train:
  epochs: 50
  seed: 42
  optimizer: adamw
  lr: 6.0e-4        # 200帧从零训练：提高早期学习速度，避免长期低mIoU平台
  weight_decay: 1.0e-4
  grad_clip: 10.0
  scheduler: onecycle  # 200帧从零训练：前期更快起量
  pct_start: 0.10
  eta_min: 1.0e-6
  amp: true
  ema_decay: 0.99   # 降低EMA滞后，避免前期验证mIoU被明显低估
  val_every: 1
  save_topk_ckpts: 5

loss:
  lambda_lovasz: 1.2
  lambda_aux: 0.1
  use_focal: true   # 200帧低标注：增强长尾/难样本梯度
  focal_gamma: 2.0
  label_smoothing: 0.0
  class_weights:
    - 1.00
    - 5.20
    - 5.20
    - 5.00
    - 4.50
    - 8.10
    - 7.00
    - 14.0
    - 1.00
    - 3.20
    - 1.50
    - 6.00
    - 1.20
    - 3.00
    - 1.00
    - 4.00
    - 1.50
    - 6.00
    - 8.00

eval:
  use_knn: false   # 验证阶段更贴近最终效果（通常+1~2 mIoU）
  knn_radius: 1
  knn_dual: false

log:
  save_dir: runs/prfnet_semantickitti
  log_interval: 50
  log_steps: false
  tb_flush_secs: 30

# ---------------- Pretrain (NOMAE + PCP) ----------------
pretrain:
  # 训练轮次与优化器
  epochs: 10
  seed: 42
  lr: 8.0e-4
  weight_decay: 1.0e-4
  grad_clip: 10.0
  amp: true
  scheduler: cosine        # cosine | onecycle
  pct_start: 0.10          # onecycle 用
  eta_min: 1.0e-6

  # 基础 mask 比例（关闭 curriculum 时生效）
  rv_mask_ratio: 0.70
  pb_mask_ratio: 0.70

  # 预训练损失权重
  lambda_occ: 1.0
  lambda_pcp: 1.0          # 建议 >=1.0，避免 PCP 信号过弱
  log_interval: 20

  # -------- Phase A: mask curriculum + 早停 --------
  mask_curriculum_enable: true
  mask_curriculum_warmup_ratio: 0.20
  rv_mask_ratio_start: 0.70
  rv_mask_ratio_end: 0.92
  pb_mask_ratio_start: 0.70
  pb_mask_ratio_end: 0.92

  early_stop_enable: true
  early_stop_window: 200
  early_stop_occ_thr: 1.0e-3
  early_stop_pcp_thr: 1.0e-3
  early_stop_gnorm_thr: 0.05
  early_stop_patience_steps: 600

  # -------- Phase B/C: 泄漏捷径修复 --------
  input_masking_enable: true
  input_masking_mode: zero    # zero | token
  informative_occ_only: true  # OCC 仅在有效邻域监督
  pcp_stopgrad_replace: true  # PCP 先预测中心再替换（stop-grad）

  # -------- Phase D: OCC 损失与 mask 采样约束 --------
  occ_scales: [1, 3, 5]       # 多尺度邻域占据建模
  occ_loss_type: bce_pos_weight  # bce | bce_pos_weight | focal
  occ_pos_weight: 5.0
  occ_focal_gamma: 2.0

  mask_pos_ratio_control_enable: true
  mask_pos_ratio_min: 0.08
  mask_pos_ratio_max: 0.50
  mask_resample_max_tries: 5

# Pretraining-specific data/model overrides (optional)
pretrain_data:
  batch_size: 4
  num_workers: 20
  augment: true
  use_polarmix: false
  use_lasermix: false
  polarmix_p: 0.0
  lasermix_p: 0.0

pretrain_model:
  use_vcg: false
  use_proto: false

pretrain_log:
  save_dir: runs/prfnet_pretrain_nomae_pcp
