# PRFNet 16-lidar 统一配置：NOMAE/PCP 预训练 + RankMe + SELECT + 300帧微调

data:
  dataset_name: 16lidar
  root: /root/autodl-tmp/16lidar_v1.0/dataset/
  num_classes: 19
  ignore_index: 255
  rv_H: 16
  rv_W: 1024
  pb_H: 256
  pb_W: 1024
  max_points: 65536
  fov_up: 15.0
  fov_down: -15.0
  R_max: 85.0
  batch_size: 4
  num_workers: 12
  val_batch_size: 4
  val_num_workers: 12
  augment: true
  use_polarmix: false
  rotate: true
  flip: true
  scale_min: 0.95
  scale_max: 1.05
  drop_p: 0.02
  polarmix_p: 0.0
  polarmix_sectors: 8
  use_lasermix: false
  lasermix_p: 0.0
  use_surface_normals: false
  use_angle_encoding: true
  low_label_finetune:
    enable: true
    num_frames: 300
    seed: 42
    balance_by_seq: true
    selected_frames_path: selected_frames_select.txt
    selected_frames_strict: true
    selected_frames_fill_random: false
    dump_indices_path: selected_train_indices.txt
  copy_paste:
    enable: false
    bank_path: "instance_bank_semantickitti.npz"
    classes:
      7: {prob: 0.90, k: 3}
      6: {prob: 0.70, k: 3}
      5: {prob: 0.60, k: 2}
      2: {prob: 0.50, k: 2}
      1: {prob: 0.40, k: 2}
    drop_p_base: 0.05
    min_keep_pts: 15
    max_tries: 50

model:
  pb_in: 9
  enc_channels: [64, 128, 256, 256]
  dec_out_c: 64
  head_dropout: 0.10
  expand_ratios: [2, 2, 4, 4]
  rv_strides: [[1,2],[2,2],[2,2],[2,2]]
  pb_strides: [[2,2],[2,2],[2,2],[2,2]]
  aspp_rates: [1, 3, 6, 9]
  use_ds_aaff: true
  ds_aaff_K: 4
  use_surface_normals: false
  use_angle_encoding: true
  use_vcg: false
  use_proto: false
  proto_dim: 64
  rv_in: 9

train:
  epochs: 120
  seed: 42
  optimizer: adamw
  lr: 2.0e-4
  weight_decay: 1.0e-4
  layerwise_lr:
    enable: true
    lr_mult_backbone: 0.20
    lr_mult_mid: 0.50
    lr_mult_head: 1.00
    wd_mult_backbone: 1.00
    wd_mult_mid: 1.00
    wd_mult_head: 1.00
  grad_clip: 10.0
  scheduler: cosine
  pct_start: 0.10
  eta_min: 1.0e-6
  amp: true
  ema_decay: 0.999
  val_every: 1
  save_topk_ckpts: 5

loss:
  lambda_lovasz: 1.5
  lambda_aux: 0.1
  use_focal: true
  focal_gamma: 2.0
  label_smoothing: 0.0
  class_weights:
    - 1.00
    - 5.20
    - 5.20
    - 5.00
    - 4.50
    - 8.10
    - 7.00
    - 14.0
    - 1.00
    - 3.20
    - 1.50
    - 6.00
    - 1.20
    - 3.00
    - 1.00
    - 4.00
    - 1.50
    - 6.00
    - 8.00

eval:
  use_knn: false
  knn_radius: 1
  knn_dual: false

log:
  save_dir: runs/prfnet_16lidar
  log_interval: 50
  log_steps: false
  tb_flush_secs: 30

# ---------------- Pretrain (NOMAE + PCP) ----------------
pretrain:
  epochs: 30
  seed: 42
  lr: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip: 10.0
  amp: true
  scheduler: cosine
  pct_start: 0.10
  eta_min: 1.0e-6
  lr_warmup_ratio: 0.10

  rv_mask_ratio: 0.65
  pb_mask_ratio: 0.65

  lambda_occ: 1.0
  lambda_pcp: 1.5
  lambda_occ_rv: 1.0
  lambda_occ_pb: 1.0
  lambda_pcp_rv: 1.5
  lambda_pcp_pb: 1.0
  log_interval: 500

  mask_curriculum_enable: true
  mask_curriculum_warmup_ratio: 0.20
  rv_mask_ratio_start: 0.60
  rv_mask_ratio_end: 0.78
  pb_mask_ratio_start: 0.60
  pb_mask_ratio_end: 0.78

  early_stop_enable: false
  early_stop_mode: relative
  early_stop_window: 200
  early_stop_min_steps: 2000
  early_stop_rel_tol: 1.0e-3
  early_stop_rel_window: 200
  early_stop_occ_thr: 1.0e-3
  early_stop_pcp_thr: 1.0e-3
  early_stop_gnorm_thr: 0.05
  early_stop_patience_steps: 1500

  input_masking_enable: true
  input_masking_mode: token
  informative_occ_only: true
  pcp_informative_only: true
  pcp_stopgrad_replace: true
  neighbor_sup_only_visible: true
  pcp_residual_center: true
  pcp_far_only: true

  occ_scales: [1, 3, 5]
  occ_loss_type: bce_pos_weight
  occ_pos_weight: 5.0
  occ_pos_weight_adaptive: true
  occ_pos_weight_min: 1.5
  occ_pos_weight_max: 12.0
  occ_pos_weight_ema_decay: 0.95
  occ_focal_gamma: 2.0
  pcp_pos_weight: 1.2
  pcp_near_range_max: 10.0
  pcp_near_weight: 1.6

  mask_strategy: mixed
  rv_band_axis: row
  pb_band_axis: col
  mask_mix_random: 0.50
  mask_mix_block: 0.25
  mask_mix_band: 0.15
  mask_mix_hmg: 0.10
  hmg_coarse_stride: 8
  hmg_fine_extra_ratio: 0.05
  block_h_min: 4
  block_h_max: 12
  block_w_min: 16
  block_w_max: 48

  mask_pos_ratio_control_enable: true
  mask_pos_ratio_min: 0.08
  mask_pos_ratio_max: 0.45
  mask_resample_max_tries: 5

  probe_eval_enable: false
  probe_eval_every: 2
  probe_train_steps: 2000
  probe_eval_steps: 300
  probe_lr: 1.0e-2
  probe_weight_decay: 0.0
  probe_batch_size: 4
  probe_num_workers: 8
  probe_patience_epochs: 0

  rankme_eval_enable: true
  rankme_eval_every: 1
  rankme_eval_steps: 80
  rankme_eval_max_points: 30000
  rankme_center: true

  cross_view_consistency_enable: true
  lambda_cv: 0.05
  cv_stop_grad: false
  cv_only_visible: true

pretrain_data:
  batch_size: 4
  num_workers: 12
  augment: true
  use_polarmix: false
  use_lasermix: false
  polarmix_p: 0.0
  lasermix_p: 0.0

pretrain_model:
  use_vcg: false
  use_proto: false

pretrain_log:
  save_dir: runs/prfnet_16lidar_pretrain_rankme

select:
  enable: true
  seqs: "00,01,02,03,04,05,06"
  budget: 300
  ckpt_list: ""
  ckpt_glob: ""
  candidate_pool_ratio: 0.35
  candidate_pool_min: 1200
  candidate_rep_ratio: 0.15
  candidate_rep_min: 400
  mc_passes: 6
  ensemble_max_models: 3
  uncertainty_use_entropy: 1
  uncertainty_use_mi: 1
  uncertainty_use_vr: 1
  w_unc_mi: 1.0
  w_unc_entropy: 0.5
  w_unc_vr: 0.5
  r_min: 0.5
  r_max: 85.0
  max_points: 65536
  w_unc: 1.0
  w_rep: 1.0
  w_bal: 0.6
  temporal_min_stem_gap: 8
  seed: 42
  out_txt: selected_frames_select.txt
